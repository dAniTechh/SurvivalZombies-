spring.application.name=demo

# ==========================================
# CONFIGURACIÓN DE BASE DE DATOS MYSQL (FLEXIBLE)
# ==========================================
# Si corre en Docker, usará la variable de entorno de docker-compose. Si corre en IDE, usará localhost:3307
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/zombies_db?serverTimezone=UTC}
spring.datasource.username=zombie_user

# Añadimos 'zombie_password' como fallback por si DB_PASSWORD no está definida en el sistema local
spring.datasource.password=${DB_PASSWORD:zombie_password}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── CONFIGURACIÓN DE HIBERNATE / JPA ──
# Update hace que Spring cree o actualice las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update

# 'true' si en algún momento deseas ver las consultas SQL en la consola
spring.jpa.show-sql=false

# ==========================================
# CONFIGURACIÓN DE SEGURIDAD (JWT)
# ==========================================
# Debe ser una cadena Base64 de al menos 32 caracteres
jwt.secret=U3VwZXJTZWNyZXRLZXlGb3Jab21iaWVzU2VydmVyMTIzNDU2Nzg5MEFCR0RFRkdISUpLTE1OT1BRUlNUVVZXWFla

# ==========================================
# CONFIGURACIÓN DE BASE DE DATOS MONGODB (FLEXIBLE)
# ==========================================
# Usamos spring.data.mongodb.uri que es más fácil de parametrizar para Docker y local
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/zombies_analytics}

# Evita que JPA/Hibernate intente escanear y mapear los documentos de MongoDB
spring.data.jpa.repositories.bootstrap-mode=default